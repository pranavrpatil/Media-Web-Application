<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Media SDK Documentation</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #172033;
            background: #f5f7fb;
        }

        body {
            margin: 0;
        }

        main {
            box-sizing: border-box;
            max-width: 760px;
            margin: 0 auto;
            padding: 72px 24px;
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #5263c8;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            line-height: 1;
            letter-spacing: -0.04em;
        }

        p {
            max-width: 600px;
            margin: 24px 0 0;
            color: #536078;
            font-size: 1.1rem;
            line-height: 1.7;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 36px;
        }

        a {
            display: inline-block;
            padding: 12px 16px;
            border: 1px solid #d5dbeb;
            border-radius: 8px;
            color: #293a9b;
            background: #fff;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            border-color: #5263c8;
            background: #f0f2ff;
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Media SDK</p>
        <h1>Documentation</h1>
        <p>
            Framework-agnostic media client with React and React Native adapters,
            typed media contracts, caching, request de-duplication, and headless UI components.
        </p>
        <nav aria-label="Documentation links">
            <a href="documentation.html">Read the full SDK documentation</a>
            <a href="https://github.com/">View the source repository</a>
        </nav>
    </main>
</body>

</html>
